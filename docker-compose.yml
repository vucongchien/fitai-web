services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: fitai-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # App
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # Backend gRPC URL (PHẢI điền vào .env)
      FITAI_RPC_URL: ${FITAI_RPC_URL}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fitai-network
    labels:
      - "com.fitai.service=web"
      - "com.fitai.version=1.0"

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fitai-web-dev
    profiles:
      - dev
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-3000}:3000"
    volumes:
      # Mount source code để hot reload
      - .:/app
      # Ngăn node_modules trên host ghi đè trong container
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      FITAI_RPC_URL: ${FITAI_RPC_URL}
    env_file:
      - .env
    networks:
      - fitai-network

networks:
  fitai-network:
    name: fitai-network
    driver: bridge
