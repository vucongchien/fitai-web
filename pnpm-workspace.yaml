packages:
  - "."

minimumReleaseAgeExclude:
  - "next@16.3.0-canary.106"
  - "@next/env@16.3.0-canary.106"
  - "@next/swc-darwin-arm64@16.3.0-canary.106"
  - "@next/swc-darwin-x64@16.3.0-canary.106"
  - "@next/swc-linux-arm64-gnu@16.3.0-canary.106"
  - "@next/swc-linux-arm64-musl@16.3.0-canary.106"
  - "@next/swc-linux-x64-gnu@16.3.0-canary.106"
  - "@next/swc-linux-x64-musl@16.3.0-canary.106"
  - "@next/swc-win32-arm64-msvc@16.3.0-canary.106"
  - "@next/swc-win32-x64-msvc@16.3.0-canary.106"

allowBuilds:
  "@bufbuild/buf": true
  # Only meaningful under Firebase App Hosting, which reads FIREBASE_WEBAPP_CONFIG
  # and calls firebase.googleapis.com during install. We pass config through
  # NEXT_PUBLIC_FIREBASE_* instead, and dist/postinstall.{js,mjs} ship prebuilt,
  # so skipping it keeps installs offline and deterministic.
  "@firebase/util": false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
